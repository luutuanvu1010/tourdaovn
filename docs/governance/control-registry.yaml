# CONTROL REGISTRY — bản đồ control tới bộ thực thi
#
# Sổ này KHÔNG phải luật. Luật là docs/core-specs/04-CONSTRAINTS.md. Sổ này chỉ
# trả lời một câu: "control X được thi hành bằng file nào, trong pipeline nào".
# Chính header của scripts/validators/control-registry-gate.ts nói vậy:
# "The registry is not law. This gate only proves that the implementation map is
# internally coherent and that live controls point to real executors wired into
# the declared pipeline."
#
# Cách soạn (2026-08-05): đọc mã nguồn, không đọc tài liệu. `level` lấy từ
# VALIDATOR_LEVELS / PY_VALIDATOR_LEVELS / R_VALIDATOR_LEVELS trong chính các
# module thi hành, không lấy từ bảng trong 04-CONSTRAINTS, vì bảng đó là ý định
# còn mã là thực tế. Đã đối chiếu: cả 19 validator I, 8 PY, và R1/R2 đều tồn tại
# thật dưới dạng hàm, không có id nào chỉ nằm trong bảng level.
#
# LƯU Ý VỀ ĐƯỜNG PHÁT HÀNH: ADR-0022 (2026-08-04) đã gỡ validator ra khỏi đường
# phát hành tự động. `build:ci` = `npm run build` = `astro check && astro build`,
# không chạy validator nào. Các pipeline dưới đây là lệnh gọi TAY. Một control
# `live` nghĩa là "chạy được khi gọi tay", không phải "tự chặn mọi lần deploy".
#
# ⚠️ CẬP NHẬT 2026-08-24 — TÌNH TRẠNG ĐÃ ĐỔI, PHẦN `controls:` DƯỚI ĐÂY CHƯA THEO KỊP.
#
# Khối "⚠️ TÌNH TRẠNG THẬT 2026-08-05" từng ghi ở đây (chỉ 4/31 control chạy
# được, `shared/gates/` không tồn tại, ERR_MODULE_NOT_FOUND) đã SAI so với thực
# tế hôm nay. Đã tự xác minh lại, không tin theo văn bản cũ:
#
#   - `shared/gates/index.ts` và `shared/gates/types.ts` tồn tại thật trong repo,
#     vào git từ commit `b73326c` (2026-08-06, "tra no ND-005 — bo kiem rang buoc
#     chay duoc lan dau"). Thư mục `shared/` không còn thiếu.
#   - Bộ kiểm ràng buộc pre-build CHẠY ĐƯỢC. Đo lại 2026-08-24 bằng
#     `npm --prefix scripts run validate`: 31 validator, 15 pass, 11 FAIL, 2 WARN
#     (0 stub, 3 defer). Không còn ERR_MODULE_NOT_FOUND.
#   - `scripts/reports/validator-status.json` tồn tại thật và vừa được lệnh trên
#     ghi lại (report timestamp 2026-08-24).
#   - Theo `docs/DECISIONS.md` mục `QĐ-2026-08-06-03`, nợ ND-005 đã được trả ngày
#     2026-08-06 (khi đó 24 pass/2 fail/2 warn/3 defer). Số fail tăng lên 11 kể
#     từ đó là do dữ liệu CMS trôi thêm (vi phạm bất biến thật, ví dụ thiếu
#     summary.vi / slug.vi cho S2.5), không phải bộ kiểm hỏng lại.
#
# CHƯA LÀM: 27 dòng `status: gap` / `evidence: "chưa có — sẽ là ..."` bên dưới
# (I1–I5, I7–I19, PY1–PY7, R1, R2) vẫn giữ nguyên như bản 2026-08-05 và KHÔNG
# được lật thành `live` trong đợt cập nhật này — đó là quyết định của chủ dự
# án, không phải việc tự quyết ở đây. Lý do phải hỏi: 11/31 validator đang đỏ
# thật (vi phạm dữ liệu, không phải lỗi code); nếu lật cả 27 dòng thành `live`
# ngay bây giờ, `control-registry-gate` sẽ đòi bằng chứng cho tất cả và chuyển
# đỏ vì 11 control trong số đó chưa có bằng chứng "xanh". Câu hỏi cần chủ dự án
# trả lời: coi "chạy được, một số đỏ vì dữ liệu" có tính là `live` không, hay chỉ
# phần đang pass (15/31) được lật, hay giữ nguyên `gap` cho tới khi dữ liệu sạch.
# Xem phiếu nợ ND-005 (đã trả ở QĐ-2026-08-06-03) và DRIFT_LOG.md liên quan.

pipelines:
  prebuild-validate:
    stage: pre-build
    command: npm --prefix scripts run validate
    files:
      - scripts/validate-constraints.ts
      - scripts/validators/i1-i19.ts
      - scripts/validators/py1-py8.ts
      - scripts/validators/r1-r4.ts

  postbuild-validate:
    stage: post-build
    command: npm --prefix scripts run validate:post
    files:
      - scripts/validators/jsonld-post.ts
      - scripts/validators/r3-r4-post.ts
      - scripts/validators/governance-post.ts
      - scripts/validators/geo-knowledge-post.ts
      - scripts/validators/entity-layout-post.ts
      - scripts/validators/control-registry-gate.ts
      - scripts/validators/deferred-gate.ts

