# Cảnh báo sớm advisory (không phải cổng chặn merge — branch protection
# không bật được trên GitHub free+private; cổng phát hành thật là Cloudflare build:ci).
# Founder thêm secret repo SANITY_READ_TOKEN để validator đọc dataset private.
name: validate

on:
  pull_request:
    branches: [main]
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài deps validator
        working-directory: scripts
        run: npm install
      - name: Chạy cổng tối thiểu (V2 reference + V3 governance)
        working-directory: scripts
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: production
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: npm run validate:min
